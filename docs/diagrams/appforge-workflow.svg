er-end="url(#id11)" points="65,1544 35,1544 35,729 380,729" stroke="#7861B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" marker-end="url(#id12)" points="1280,1618 1280,1685" stroke="#26836A" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" marker-end="url(#id13)" points="1530,1738 1610,1738 1610,1119 1000,1119" stroke="#258D9B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#EAF6F7" height="38" rx="12" stroke="none" stroke-width="2" width="300" x="1273" y="1206" /><text fill="#258D9B" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="middle" x="1423.0" y="1233">恢复历史与成功版本</text><rect fill="#EDF4FC" height="92" rx="17" stroke="#3979BF" stroke-width="2" width="620" x="380" y="230" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="690.0" y="287.0">注册 / 登录</text><rect fill="#EDF4FC" height="110" rx="17" stroke="#3979BF" stroke-width="2" width="620" x="380" y="360" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="690.0" y="403">输入需求，创建应用</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="690.0" y="442">也可进入已有作品继续创作</text><rect fill="#F2EEF9" height="110" rx="17" stroke="#7861B4" stroke-width="2" width="620" x="380" y="510" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="690.0" y="553">确定代码生成模式</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="690.0" y="592">用户指定优先 · HTML / 多文件 / Vue</text><rect fill="#F2EEF9" height="138" rx="17" stroke="#7861B4" stroke-width="2" width="620" x="380" y="660" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="690.0" y="703">模型生成与受限文件操作</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="690.0" y="742">SSE 推送文本、工具事件和文件进度</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="690.0" y="776">Vue 工程额外执行 Docker 构建</text><polygon fill="#FBF6E5" points="690,844.0 865.0,920 690,996.0 515.0,920" stroke="#AD8426" stroke-width="3" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="middle" x="690" y="913">生成与校验</text><text fill="#242532" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="middle" x="690" y="947">是否成功？</text><rect fill="#FFF0E8" height="148" rx="17" stroke="#E85B36" stroke-width="2" width="410" x="1130" y="845" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" text-anchor="middle" x="1335.0" y="888">失败或停止</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="1335.0" y="927">保留上一成功版本</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="1335.0" y="961">首次失败时暂无成功预览</text><rect fill="#EDF4FC" height="118" rx="17" stroke="#3979BF" stroke-width="2" width="620" x="380" y="1060" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="690.0" y="1103">保存成功版本，预览网站</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="690.0" y="1142">支持源码查看、文件对比与设备预览</text><polygon fill="#FBF6E5" points="690,1220.0 865.0,1298 690,1376.0 515.0,1298" stroke="#AD8426" stroke-width="3" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="middle" x="690" y="1291">是否需要</text><text fill="#242532" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="middle" x="690" y="1325">继续修改？</text><rect fill="#F2EEF9" height="148" rx="17" stroke="#7861B4" stroke-width="2" width="480" x="65" y="1470" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" text-anchor="middle" x="305.0" y="1513">可视化选区 / 继续对话</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="305.0" y="1552">提交新的修改要求</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="305.0" y="1586">重新生成、构建并校验</text><rect fill="#EDF6F0" height="148" rx="17" stroke="#26836A" stroke-width="2" width="500" x="1030" y="1470" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="1280.0" y="1513">发布作品 / 下载源码</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="1280.0" y="1552">发布绑定指定成功版本</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="1280.0" y="1586">源码 ZIP 可独立下载</text><rect fill="#EAF6F7" height="106" rx="17" stroke="#258D9B" stroke-width="2" width="500" x="1030" y="1685" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" text-anchor="middle" x="1280.0" y="1728">重新进入应用</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="middle" x="1280.0" y="1767">加载对话历史，继续创作</text><rect fill="#EDF6F0" height="106" rx="17" stroke="#26836A" stroke-width="2" width="690" x="95" y="1690" /><text fill="#242532" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="middle" x="440.0" y="1733">可选能力：自动封面 / 自定义封面</text><text fill="#6D707D" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" text-anchor="middle" x="440.0" y="1772">封面按版本异步生成，不是下载前置步骤</text></svg>