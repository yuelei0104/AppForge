spring:
  application:
    name: app
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/appforge
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      ttl: 3600

server:
  port: 8125
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key:
      model-name: deepseek-flash
      max-retries: 3
      log-requests: true
      log-responses: true
      reasoning-effort: none

    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key:
      model-name: deepseek-flash
      max-tokens: 16384
      log-requests: true
      log-responses: true
      reasoning-effort: none

    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key:
      model-name: deepseek-flash
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true

    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key:
      model-name: deepseek-flash
      log-requests: true
      log-responses: true

cos:
  client:
    host: ${COS_HOST:https://appforge-1317627961.cos.ap-shanghai.myqcloud.com}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:appforge-1317627961}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuelei.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


dubbo:
  application:
    name: appforge-app
    protocol: tri
    qos-enable: false

  registry:
    address: nacos://127.0.0.1:8848
    register-mode: instance
    parameters:
      username: nacos
      password: nacos

  protocol:
    name: tri
    port: 50053

  consumer:
    timeout: 60000

  provider:
    timeout: 60000
