name: Vue runtime verification

on:
  push:
    branches: [verify/vue-runtime]
  pull_request:
    paths:
      - 'appforge-backend/**'
      - '.github/workflows/vue-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vue-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APPFORGE_DOCKER_TEST: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: appforge-backend/pom.xml
      - name: Check real Docker daemon
        run: docker version
      - name: Verify streams, workspace and actual Docker builds
        working-directory: appforge-backend
        run: bash mvnw -B -Dtest=VueBuilderRegistrationTest,VueProjectRuntimeTest,ToolStreamHandlerTest,VueToolStreamingTest,VueToolHttpCancellationTest,LangchainConfigurationTest,NativeCodeCompletionTest,CancellableCodeStreamTest,NativeAssetsTest,NativeSourceDownloadTest,AiCodeGeneratorServiceFactoryTest,AppCreationModeTest,AppWorkspaceTest,AiCodeGeneratorFacadeMemoryTest,AppServiceAccessTest,ChatHistoryIntegrationTest,ChatConversationExtensionsTest,AppMetadataTest,CodeParserTest,VueProjectTest test
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vue-runtime-evidence
          path: |
            appforge-backend/target/vue-runtime-evidence
            appforge-backend/target/surefire-reports/TEST-*.xml
            appforge-backend/target/native-source-fixture.zip
            appforge-backend/target/tool-stream-browser-fixture.json
            appforge-backend/target/native-preview-fixture
          retention-days: 7
