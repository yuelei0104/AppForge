name: Vue runtime verification

on:
  push:
    branches: [verify/vue-runtime]
  pull_request:
    paths:
      - 'appforge-backend/**'
      - 'appforge-vue/**'
      - 'sql/**'
      - '.github/workflows/vue-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vue-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APPFORGE_DOCKER_TEST: 'true'
      APPFORGE_COVER_CHROME_TEST: 'true'
      APPFORGE_COVER_MYSQL_TEST: 'true'
      APPFORGE_COVER_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13306/appforge_cover_test?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false'
      APPFORGE_COVER_MYSQL_PASSWORD: 'cover-ci-only-password'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'cover-ci-only-password'
          MYSQL_DATABASE: appforge_cover_test
          MYSQL_ROOT_HOST: '%'
        ports: ['13306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: appforge-backend/pom.xml
      - name: Check real Docker daemon
        run: docker version
      - name: Verify streams, workspace and actual Docker builds
        working-directory: appforge-backend
        run: bash mvnw -B -Dtest=VisualEditToolsTest,CoverTaskTest,CoverWorkerTest,CoverHttpTest,CoverChromeTest,CoverMySqlTest,VueBuilderRegistrationTest,VueProjectRuntimeTest,ToolStreamHandlerTest,VueToolStreamingTest,VueToolHttpCancellationTest,LangchainConfigurationTest,NativeCodeCompletionTest,CancellableCodeStreamTest,NativeAssetsTest,NativeSourceDownloadTest,AiCodeGeneratorServiceFactoryTest,AppCreationModeTest,AppWorkspaceTest,AiCodeGeneratorFacadeMemoryTest,AppServiceAccessTest,ChatHistoryIntegrationTest,ChatConversationExtensionsTest,AppMetadataTest,CodeParserTest,VueProjectTest test
      - name: Screenshot the actual Docker-built Vue project
        working-directory: appforge-backend
        env:
          APPFORGE_COVER_PROJECT_DIST: target/vue-runtime-evidence/dist
          APPFORGE_VISUAL_PROJECT_DIST: target/vue-runtime-evidence/dist
        run: bash mvnw -B -Dtest=CoverChromeTest,VisualEditToolsTest test
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vue-runtime-evidence
          path: |
            appforge-backend/target/visual-edit-fixture
            appforge-backend/target/cover-evidence
            appforge-backend/target/cover-render-fixture.json
            appforge-backend/target/vue-runtime-evidence
            appforge-backend/target/surefire-reports/TEST-*.xml
            appforge-backend/target/native-source-fixture.zip
            appforge-backend/target/tool-stream-browser-fixture.json
            appforge-backend/target/native-preview-fixture
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: appforge-vue/package-lock.json
      - name: Verify frontend
        working-directory: appforge-vue
        run: |
          npm ci
          npm test
          npm run build
