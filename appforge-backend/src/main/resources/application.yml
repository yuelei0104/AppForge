spring:
  application:
    name: appforge-backend
  # 只使用 Redis 作为对话记忆存储，项目没有使用 Redis Embedding Store
  autoconfigure:
    exclude: dev.langchain4j.community.store.embedding.redis.spring.RedisEmbeddingStoreAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/appforge
    username: root
    password: 123456
  profiles:
    active: local
  # redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      ttl: 3600
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000


server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000


# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuelei.appforge.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-08fffb88ea1942b8b1b0559e1da77838
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      reasoning-effort: none

    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-08fffb88ea1942b8b1b0559e1da77838
      model-name: deepseek-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
      reasoning-effort: none

logging:
  level:
    dev.langchain4j: DEBUG

cos:
  client:
    host: https://appforge-1317627961.cos.ap-shanghai.myqcloud.com
    secretId: ${TENCENT_CLOUD_SECRET_ID}
    secretKey: ${TENCENT_CLOUD_SECRET_KEY}
    region: ap-shanghai
    bucket: appforge-1317627961

app:
  screenshot:
    base-url: http://127.0.0.1:8123/api
