spring:
  application:
    name: appforge-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/appforge
    username: root
    password: 123456


server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuelei.appforge.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


